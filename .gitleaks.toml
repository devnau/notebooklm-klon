title = "notebooklm-klon gitleaks config"

# Basis-Regelsatz von gitleaks übernehmen und um projektspezifische Muster ergänzen.
[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[a-zA-Z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "voyage-api-key"
description = "Voyage AI API key"
regex = '''pa-[a-zA-Z0-9_\-]{30,}'''
keywords = ["pa-"]

[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase service_role JWT"
regex = '''eyJ[a-zA-Z0-9_\-]{10,}\.eyJ[a-zA-Z0-9_\-]{20,}\.[a-zA-Z0-9_\-]{20,}'''
keywords = ["eyJ"]

[[rules]]
id = "postgres-connection-string"
description = "Postgres connection string with inline password"
regex = '''postgres(?:ql)?:\/\/[^:\s]+:[^@\s]+@'''
keywords = ["postgres://", "postgresql://"]

  # docker-compose.yml enthält Verbindungsstrings der Form
  # postgres://role:${POSTGRES_PASSWORD}@db:5432/postgres — das ist eine
  # Compose-Variablenreferenz, kein Passwort. Die Regel bleibt scharf für
  # tatsächlich eingebettete Passwörter.
  #
  # RE2 (die Regex-Engine von gitleaks) kennt kein Lookahead, deshalb ist das
  # eine Allowlist und keine Negation im Muster selbst.
  [rules.allowlist]
  regexes = ['''postgres(?:ql)?:\/\/[^:\s]+:\$\{[A-Za-z_][A-Za-z0-9_]*\}@''']
  regexTarget = "match"

[allowlist]
description = "Platzhalter, Beispieldateien und bekannte Testwerte"
paths = [
  '''\.env\.example$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)tests/fixtures/''',
]
regexes = [
  # Platzhalter in .env.example und in der Dokumentation
  '''sk-ant-your-key-here''',
  '''<[A-Z_]+>''',
  '''REPLACE_ME''',
  '''changeme''',
  # Feste Testzugangsdaten des Smoke-Tests. Bewusst als exakter Wert
  # freigegeben und nicht die ganze Datei: ein echter Schlüssel, der dort
  # hineingerät, soll weiterhin gefunden werden.
  '''smoke-test-passwort-2026''',
  '''ingest-e2e-passwort-1234''',
  # Beispiel-Passwörter in der Dokumentation
  '''your-super-secret''',
]
