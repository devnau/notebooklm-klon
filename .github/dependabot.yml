version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch- und Minor-Updates gesammelt, damit nicht jede Woche zehn PRs
      # aufgehen. Major-Updates kommen einzeln, weil sie geprüft werden müssen.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # TypeScript 7 ist zwar aktuell, aber typescript-eslint@8 verlangt
      # `<6.1.0` als Peer — `npm ci` scheitert dann mit ERESOLVE, und zwar
      # nicht im Lint-Job, sondern schon bei der Installation in jedem Job.
      # Begründung und Ausstiegspfad in docs/adr/0007-typescript-5-statt-7.md.
      # Zu entfernen, sobald typescript-eslint 8 nachzieht.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(docker)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
