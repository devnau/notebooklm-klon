# Entwicklungs-Stack. Für Produktion zusätzlich docker-compose.prod.yml laden:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Bewusst ohne Kong: das Gateway ist Caddy, das in Produktion ohnehin für TLS
# gebraucht wird. Das spart einen Container und eine Konfigurationssprache.
# Details und Trade-offs in docs/adr/0002-caddy-statt-kong.md.

name: notebooklm-klon

services:
  # ── Datenbank ───────────────────────────────────────────────────────────────
  db:
    image: supabase/postgres:17.6.1.156
    container_name: nlm-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      # Kein Mount auf /docker-entrypoint-initdb.d: das Image legt dort selbst
      # Rollen (authenticator, anon, service_role, ...) sowie die Schemas auth
      # und storage an. Ein Verzeichnis-Mount würde das überdecken. Alles
      # Anwendungsspezifische läuft stattdessen über den migrate-Service.
    ports:
      # Nur lokal gebunden — die DB darf nie aus dem Netz erreichbar sein.
      - '127.0.0.1:${POSTGRES_PORT:-54322}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h localhost']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Migrationen ─────────────────────────────────────────────────────────────
  # Läuft einmal bis zum Ende und beendet sich. Alle anderen Dienste warten
  # darauf, damit niemand gegen ein halb migriertes Schema startet.
  migrate:
    image: postgres:17-alpine
    container_name: nlm-migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/db/migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/sh', '/migrate.sh']

  # ── Auth (GoTrue) ───────────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.193.1
    container_name: nlm-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth&sslmode=disable

      API_EXTERNAL_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8000}
      GOTRUE_SITE_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_APP_URL:-http://localhost:3000}/**

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'false'

      # Im Dev-Betrieb landen Mails in Mailpit; Bestätigung daher nicht nötig.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mailpit}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-noreply@localhost}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Notebook Studio}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/confirm
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/confirm
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/confirm
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/confirm

      # Passwortregeln: Länge schlägt Zeichenklassen-Zwang.
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_VERIFY: 30

      GOTRUE_LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:9999/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── REST (PostgREST) ────────────────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v14.15
    container_name: nlm-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      # Kein automatisches Schema-Reload-Polling; wir triggern per NOTIFY.
      PGRST_DB_CHANNEL_ENABLED: 'true'
      PGRST_DB_CHANNEL: pgrst
      PGRST_LOG_LEVEL: ${LOG_LEVEL:-error}
      # Admin-Server mit /live und /ready. Ein Docker-Healthcheck ist hier nicht
      # möglich — das PostgREST-Image ist distroless und hat weder Shell noch
      # wget. Geprüft wird stattdessen über das Gateway (/rest/v1/) und in
      # Phase 7 über /api/health der App.
      PGRST_ADMIN_SERVER_PORT: 3001
    command: postgrest

  # ── Storage ─────────────────────────────────────────────────────────────────
  storage:
    image: supabase/storage-api:v1.67.20
    container_name: nlm-storage
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY fehlt in .env}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY fehlt in .env}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      DB_INSTALL_ROLES: 'false'
      POSTGREST_URL: http://rest:3000
      TENANT_ID: notebooklm
      REGION: local
      # Datei-Backend statt S3: für einen einzelnen Server einfacher zu sichern.
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: notebooklm
      FILE_SIZE_LIMIT: 52428800 # 50 MB, siehe MAX_UPLOAD_BYTES
      UPLOAD_FILE_SIZE_LIMIT: 52428800
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: 52428800
      # Bildtransformation brauchen wir nicht — spart den imgproxy-Container.
      ENABLE_IMAGE_TRANSFORMATION: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:5000/status',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Realtime ────────────────────────────────────────────────────────────────
  # Liefert Änderungen an `sources` live in die Oberfläche, statt sie im Client
  # abzufragen. Ein Import läuft Minuten; ein Polling-Intervall wäre entweder zu
  # träge für die Anzeige oder zu gesprächig für den Server.
  #
  # Wichtig fürs Sicherheitsmodell: Realtime wertet die RLS-Policies für jeden
  # Abonnenten einzeln aus. Wer ein Notebook nicht sehen darf, bekommt dessen
  # Ereignisse auch dann nicht, wenn er den Kanalnamen errät.
  realtime:
    image: supabase/realtime:v2.51.11
    container_name: nlm-realtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      # supabase_admin, weil Realtime beim Start eigene Schemas (_realtime,
      # realtime) anlegt und Replikations-Slots verwaltet.
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_ENC_KEY:?REALTIME_ENC_KEY fehlt in .env}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:?REALTIME_SECRET_KEY_BASE fehlt in .env}
      APP_NAME: notebooklm
      # Ein einzelner Knoten: kein Cluster-Discovery, kein verteiltes Erlang.
      ERL_AFLAGS: '-proto_dist inet_tcp'
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      # Legt den Standard-Tenant selbst an. Ohne das müsste er nach jedem
      # Zurücksetzen der Datenbank von Hand über die API eingetragen werden.
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
      # Der Tenant-Name ist nicht frei wählbar: SEED_SELF_HOST legt ihn unter
      # der festen Kennung `realtime-dev` an, und supabase-js spricht ihn über
      # genau diese an. Ein eigener Name führt zu einem 404 beim Verbinden.
      SELF_HOST_TENANT_NAME: realtime-dev
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    # Der Health-Endpunkt ist authentifiziert und antwortet ohne Token mit 403.
    # Ein Healthcheck, der 403 als "krank" wertet, hielte den Stack für kaputt,
    # obwohl der Dienst arbeitet — deshalb wird der service_role-Key
    # mitgeschickt. Geprüft wird damit auch gleich, dass das JWT-Secret
    # zwischen Realtime und dem Rest übereinstimmt.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sSf -o /dev/null -H "Authorization: Bearer $$SERVICE_KEY" http://127.0.0.1:4000/api/tenants/realtime-dev/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Storage-Migrationen ─────────────────────────────────────────────────────
  # Zweiter Migrationsdurchlauf, nachdem der Storage-Dienst sein eigenes Schema
  # angelegt hat. storage.buckets existiert vorher nicht — die Buckets und die
  # Policies auf storage.objects lassen sich also nicht im ersten Durchlauf
  # anlegen.
  storage-init:
    image: postgres:17-alpine
    container_name: nlm-storage-init
    restart: 'no'
    depends_on:
      storage:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
      MIGRATIONS_DIR: /storage-migrations
      # Die Rollen-Passwörter stehen längst; ein zweites Mal wäre nur Lärm.
      SYNC_ROLE_PASSWORDS: '0'
    volumes:
      - ./supabase/storage-migrations:/storage-migrations:ro
      - ./docker/db/migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/sh', '/migrate.sh']

  # ── Sprachausgabe ───────────────────────────────────────────────────────────
  # Zwei Anbieter hinter einem Adapter: Piper für Deutsch, Kokoro für Englisch.
  # Kokoro-82M kann kein Deutsch (nur en, ja, zh, es, fr, hi, it, pt-BR), und
  # eine primär deutschsprachige Anwendung wäre damit unbrauchbar — unabhängig
  # von der Stimmqualität. Begründung in docs/adr/0005-piper-statt-kokoro.
  #
  # Beide werden nur für den Audio-Überblick gebraucht. Wer ihn nicht nutzt,
  # kann sie mit `docker compose up --scale piper=0 --scale kokoro=0` weglassen;
  # der Rest der Anwendung hängt nicht an ihnen.
  piper:
    build: ./docker/piper
    image: nlm-piper:local
    container_name: nlm-piper
    restart: unless-stopped
    volumes:
      # Die Stimmen werden beim ersten Gebrauch geladen und bleiben liegen.
      # Ohne das Volume lädt jeder Neustart sie erneut.
      - piper-voices:/voices
    ports:
      # Nur lokal gebunden, und nur für die Entwicklung: dort läuft der Worker
      # auf dem Host und erreicht das Docker-Netz sonst nicht. In Produktion
      # sind beide Dienste ausschliesslich intern erreichbar.
      - '127.0.0.1:${PIPER_PORT:-5001}:5000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    container_name: nlm-kokoro
    restart: unless-stopped
    environment:
      # Ohne GPU. Für die Länge eines Überblicks reicht das; auf einem Server
      # mit Grafikkarte lässt sich das Image gegen die GPU-Variante tauschen,
      # ohne dass der Adapter etwas davon merkt.
      DEVICE: cpu
    volumes:
      - kokoro-data:/app/api/src/models
    ports:
      - '127.0.0.1:${KOKORO_PORT:-8880}:8880'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health')",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 180s

  # ── Gateway ─────────────────────────────────────────────────────────────────
  # Bündelt auth/rest/storage unter einer Origin, wie supabase-js es erwartet.
  gateway:
    image: caddy:2-alpine
    container_name: nlm-gateway
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
      realtime:
        condition: service_started
      # Erst wenn die Buckets stehen: sonst antwortet die Anwendung auf einen
      # Upload mit "Bucket not found", und das sieht nach einem Fehler in der
      # Anwendung aus statt nach einem noch nicht fertigen Stack.
      storage-init:
        condition: service_completed_successfully
    environment:
      # Nur für die CORS-Freigabe in der Entwicklung: die Anwendung läuft auf
      # einem anderen Port als das Gateway, und der Datei-Upload geht direkt
      # vom Browser in den Storage-Bucket. In Produktion liegen beide auf
      # derselben Origin und es gibt nichts freizugeben.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - ./docker/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:8000/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Mailpit (nur Entwicklung) ───────────────────────────────────────────────
  # Fängt alle ausgehenden Mails ab, damit Magic Links testbar sind, ohne
  # echte Adressen zuzuspammen. Web-UI auf http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.28
    container_name: nlm-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  piper-voices:
  kokoro-data:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
